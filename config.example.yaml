# SIPREC Recorder configuration

# Address the SIP server listens on (UDP).
sip_listen_addr: "0.0.0.0:5060"

# IP advertised in SDP answers for RTP media. Leave empty to auto-detect
# the first non-loopback IPv4 address on the host.
media_ip: ""

# UDP port range used to receive RTP for recording legs (inclusive).
rtp_port_start: 10000
rtp_port_end: 11000

# Directory where .ulaw recording files are written.
recording_dir: "./recordings"

# Optional path to a GCP service account JSON key. If empty, Application
# Default Credentials are used (e.g. GKE Workload Identity).
gcp_credentials_file: ""

# Google Cloud Storage — audio recordings.
# Leave gcs_bucket empty to keep recordings on local disk only.
gcs_bucket: ""
gcs_object_prefix: "recordings"

# Google Cloud Storage — per-call metadata JSON files.
# A separate bucket keeps metadata queryable independently of the audio files.
# Leave gcs_metadata_bucket empty to keep metadata files on local disk only.
gcs_metadata_bucket: ""
gcs_metadata_object_prefix: "metadata"

# Delete the local .ulaw file only after a successful GCS upload.
delete_after_upload: true

# Upload tuning.
upload_workers: 2
upload_max_retries: 5
upload_sweep_interval_sec: 60
shutdown_upload_timeout_sec: 30

# Minimum severity emitted by the logger: trace, debug, info, notice, warn,
# error, or critical. JSON logs go to stdout with GCP Cloud Logging's
# expected "severity" field so they filter/alert correctly in GCP.
log_level: "info"

# Warn if a recording leg receives zero RTP packets within this many seconds
# of being negotiated (SBC never sent media). 0 disables the watchdog.
rtp_no_media_timeout_sec: 5

# Flag (log only, never terminate) any in-progress call older than this with
# no BYE received — usually means an SBC crashed or dropped the BYE. 0
# disables the check.
max_call_duration_hours: 12

# How often the session store is scanned for stale sessions.
stale_session_check_interval_sec: 300

# Pod-local HTTP API listen address for operational APIs such as the
# recording-split endpoint (POST /v1/recording/split).
http_listen_addr: "0.0.0.0:8080"

# IP advertised in Redis as part of "ip:port" for this pod's HTTP API.
# Leave empty to reuse the same address the SIP Contact header uses.
api_advertise_ip: ""

# Redis is used to register "loc:<Call-ID>" -> "<api_advertise_ip>:<http port>"
# for the lifetime of each call, so external systems can look up which
# recorder pod owns a call and reach its HTTP API directly. Leave
# redis_addr empty to disable the locator (the recorder still runs; it just
# won't be discoverable this way).
redis_addr: ""
redis_db: 0
redis_locator_ttl_seconds: 3600

# Google Agent Assist (Dialogflow ES). Reuses gcp_credentials_file above.
# Leave agent_assist_project_id/agent_assist_conversation_profile_id empty
# to disable — POST /v1/agent-assist/start then returns an error.
agent_assist_project_id: ""
agent_assist_location_id: "global"
agent_assist_conversation_profile_id: ""
agent_assist_sample_rate_hertz: 8000
agent_assist_send_queue_packets: 250
# Leg labels (see rs-metadata) treated as the end user vs. the human agent
# when creating Dialogflow participants; any label not listed here is
# treated as the human agent.
agent_assist_end_user_labels: ["inbound", "1"]
agent_assist_human_agent_labels: ["outbound", "2"]
