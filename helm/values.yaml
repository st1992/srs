# cx-streamlink Helm chart defaults
# Override with: helm install streamlink ./helm -f my-values.yaml

namespaceOverride: ""

# Each entry renders an independent one-replica Deployment, ConfigMap, PVC,
# and internal passthrough LoadBalancer Service. Add entries to scale the
# recorder pool; do not scale an individual recorder Deployment.
recorder:
  image:
    repository: us-central1-docker.pkg.dev/div-deai-cx-dev-usc1-ri/cx-sip/cx-streamlink-rec
    tag: "dev"
    pullPolicy: Always

  instances:
    - name: recorder-1
      loadBalancerIP: "100.73.23.145"
      sipPort: 5060
      # Pod-local HTTP API (recording-split endpoint). Since recorder pods
      # are co-located on the same host-network node, this must be unique
      # per instance, just like sipPort.
      httpPort: 8080
    - name: recorder-2
      loadBalancerIP: "100.73.23.146"
      sipPort: 5061
      httpPort: 8081

  # Recorder pods share the node network namespace. SIP ports must be unique
  # per instance; dynamically allocated RTP ports share one node-wide pool.
  hostNetwork: true
  coLocateOnSameNode: true

  # Schedule recorder pods only on c2-standard-4 nodes.
  nodeSelector:
    node.kubernetes.io/instance-type: c2-standard-4

  tolerations: []

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  strategy:
    type: Recreate

  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""

  service:
    type: LoadBalancer
    port: 5060
    # Leave empty to use the annotation on older GKE versions. On supported
    # clusters set networking.gke.io/l4-regional-internal.
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
    annotations:
      networking.gke.io/load-balancer-type: "Internal"

  gcp:
    workloadIdentity:
      gcpServiceAccount: "adtgcp-ccs-tst-insight-sa@adtgcp-ent-tst-ccs-tlcm-8143.iam.gserviceaccount.com"

    credentialsSecret:
      name: ""
      key: "key.json"

  config:
    sipListenIP: "0.0.0.0"
    # The recorder allocates even RTP ports from this node-wide shared range.
    # Recorder Services declare enough ports to make GKE use an all-ports
    # forwarding rule; a separate firewall rule must allow this full range.
    rtpPortStart: 10000
    rtpPortEnd: 30000
    recordingDir: "/app/recordings"
    gcsBucket: "cx-siprec-audio-raw-uat"
    gcsObjectPrefix: "rec"
    gcsMetadataBucket: "cx-siprec-metadata-uat"
    gcsMetadataObjectPrefix: "metadata"
    deleteAfterUpload: true
    uploadWorkers: 4
    uploadMaxRetries: 5
    uploadSweepIntervalSec: 60
    shutdownUploadTimeoutSec: 30
    logLevel: "info"
    rtpNoMediaTimeoutSec: 5
    maxCallDurationHours: 12
    staleSessionCheckIntervalSec: 300

    # Redis registers "loc:<Call-ID>" -> "<node-ip>:<httpPort>" for the
    # lifetime of each call, so an external system can discover which
    # recorder pod owns a call and reach its HTTP API (recording-split)
    # directly on the node — not through the SIP LoadBalancer. Leave
    # redisAddr empty to disable the locator; the recorder still runs.
    redisAddr: ""
    redisDB: 0
    redisLocatorTTLSeconds: 3600

    # Google Agent Assist (Dialogflow). Reuses recorder.gcp above for
    # credentials. Leave agentAssistProjectId/agentAssistConversationProfileId
    # empty to disable -- POST /v1/agent-assist/start then returns an error.
    agentAssistProjectId: ""
    # Must match the conversation profile's region: it also selects the
    # Dialogflow endpoint ("global" uses dialogflow.googleapis.com, any other
    # region uses <region>-dialogflow.googleapis.com), and the global endpoint
    # does not serve regional profiles. Supported: global, us, us-central1,
    # us-east1, us-west1, northamerica-northeast1, europe-west1, europe-west2,
    # europe-west3, europe-west4, europe-west6, asia-southeast1,
    # asia-southeast2, asia-northeast1, asia-south1, australia-southeast1.
    agentAssistLocationId: "global"
    agentAssistConversationProfileId: ""
    agentAssistSampleRateHertz: 8000
    agentAssistSendQueuePackets: 250
    agentAssistEndUserLabels: ["inbound", "1"]
    agentAssistHumanAgentLabels: ["outbound", "2"]

# Stateless signaling proxy. Its dispatcher destinations are generated from
# recorder.instances and use the recorder Service cluster DNS names.
proxy:
  image:
    repository: us-central1-docker.pkg.dev/div-deai-cx-dev-usc1-ri/cx-sip/cx-streamlink-proxy
    tag: "dev"
    pullPolicy: Always

  replicaCount: 2

  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  service:
    type: LoadBalancer
    port: 5060
    loadBalancerIP: "100.73.23.134"
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
    annotations:
      networking.gke.io/load-balancer-type: "Internal"

  config:
    debug: 2
    children: 4
    dispatcherPingInterval: 10
